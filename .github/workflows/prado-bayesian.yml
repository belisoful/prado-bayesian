name: PRADO Bayesian Extension
on:
  push:
  pull_request:
  schedule:
    # The package tracks PRADO's master branch (dev-master), so a change there can break a
    # build that no commit here triggered.  Once a week catches that.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  composerext:
    name: Bayesian (PHP ${{ matrix.php-versions }}${{ matrix.dependencies == 'lowest' && ', lowest deps' || '' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          # The oldest versions the constraints allow, on the oldest PHP: what a consumer with
          # a conservative lock file gets.
          - php-versions: '8.1'
            dependencies: 'lowest'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: bayesian
          MYSQL_DATABASE: bayesian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pbayesian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: bayesian
          POSTGRES_DB: bayesian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # A missing backend must fail the build instead of silently skipping its tests.
      BAYESIAN_REQUIRE_BACKENDS: 1
      BAYESIAN_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=bayesian_test"
      BAYESIAN_MYSQL_USER: root
      BAYESIAN_MYSQL_PASSWORD: bayesian
      BAYESIAN_PGSQL_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=bayesian_test"
      BAYESIAN_PGSQL_USER: postgres
      BAYESIAN_PGSQL_PASSWORD: bayesian

    defaults:
      run:
        working-directory: prado-bayesian

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: prado-bayesian

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype, dom, intl, json, mbstring, pcre, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, sqlite3, redis, sockets, spl, zlib
          tools: cs2pr
          # Xdebug costs a lot of run time, so only the leg that measures coverage gets it.
          coverage: ${{ matrix.php-versions == '8.3' && matrix.dependencies == 'highest' && 'xdebug' || 'none' }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # composer.lock is not committed, so the key hashes composer.json instead.
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-${{ matrix.dependencies }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-versions }}-${{ matrix.dependencies }}-composer-

      # pradosoft/prado resolves straight from Packagist (dev-master, aliased 4.4.x-dev); no
      # repository entry is needed or declared.
      - name: Install Composer dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install the lowest Composer dependencies the constraints allow
        if: matrix.dependencies == 'lowest'
        run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable --optimize-autoloader

      - name: Compile check (composer lint)
        run: composer lint

      - name: Validate code style using php-cs-fixer (composer cs)
        if: matrix.dependencies == 'highest'
        run: vendor/bin/php-cs-fixer fix -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr

      - name: Validate code using phpstan (composer stan)
        if: matrix.dependencies == 'highest'
        run: vendor/bin/phpstan analyse --memory-limit=512M --error-format=checkstyle | cs2pr

      - name: Run Unit Tests (composer unittest)
        run: composer unittest

      - name: Measure coverage
        if: matrix.php-versions == '8.3' && matrix.dependencies == 'highest'
        env:
          XDEBUG_MODE: coverage
        run: |
          composer coverage
          # The floor is deliberately below the achievable figure; the remainder is defensive
          # guards the public API cannot reach (see README).  Raise it only when new tests
          # support it.
          php tests/test_tools/check-coverage.php build/logs/clover.xml 93

  integration:
    name: Composer extension install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: prado-bayesian

      - name: Checkout PRADO framework (4.4 dev)
        uses: actions/checkout@v4
        with:
          repository: pradosoft/prado
          ref: master
          path: prado.master

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, intl, json, mbstring, pcre, pdo, pdo_sqlite, sqlite3, sockets, spl, zlib

      # Builds a throwaway consumer project that requires the extension through Composer, then
      # asserts that extra.prado's error-messages, class-map, and bootstrap all take effect and
      # that a real request reaches TBayesianService.
      - name: Verify the Composer extension wiring
        run: bash prado-bayesian/tests/integration/run-install-test.sh
